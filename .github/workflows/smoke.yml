name: smoke
# Standing consumer-smoke for Binclusive/a11y@v0 (static) + action-url@v0 (browser).
# Proves: @v0 resolves, the :0 / :0-browser images pull from ghcr, the engine
# runs, valid SARIF is emitted, and the static gate has TEETH (fails on a seeded
# violation). This is consumer-truth, not just ref-correctness.
on:
  # STANDING triggers (#2680): the monorepo release workflows emit `image-published`
  # after each republish so any image/action change auto-runs this smoke; the daily
  # schedule is the standing safety net when no cross-repo dispatch token is set;
  # `workflow_dispatch` is the manual run and `push` keeps seed/self edits self-testing.
  repository_dispatch:
    types: [image-published]
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
  push:
permissions:
  contents: read
  security-events: write # upload-sarif to code scanning

jobs:
  static-gate:
    name: static @v0 — must FAIL on the seeded violation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # continue-on-error: a seeded violation is EXPECTED to red the gate — we
      # assert that failure below rather than letting it red the whole job.
      # fail-on: warn is the real dogfood default (the runbook gates at warn), and
      # the seeded img-no-alt is a warn-tier finding — so asserting the warn gate
      # tests the ACTUAL consumer path AND proves teeth in one shot. (At block, a
      # warn-tier finding correctly does not gate — that is not a smoke failure.)
      - id: scan
        continue-on-error: true
        uses: Binclusive/a11y@v0
        with:
          fail-on: warn

      - name: Assert the gate FAILED (teeth)
        run: |
          echo "static scan outcome: ${{ steps.scan.outcome }}"
          if [ "${{ steps.scan.outcome }}" != "failure" ]; then
            echo "::error::static @v0 gate did NOT fail on a seeded img-no-alt — no teeth"
            exit 1
          fi
          echo "ok: gate failed on the seeded violation"

      - name: Assert SARIF emitted + valid + has findings
        run: |
          f="${{ steps.scan.outputs.sarif-file }}"
          echo "sarif-file: $f"
          if [ -z "$f" ] || [ ! -f "$f" ]; then
            echo "::error::static @v0 emitted no SARIF file"
            exit 1
          fi
          python3 - "$f" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert d.get("runs"), "SARIF has no runs[]"
          n = sum(len(r.get("results", [])) for r in d["runs"])
          assert n > 0, "SARIF has zero results — the seeded violation was not reported"
          print(f"ok: valid SARIF, {n} result(s)")
          PY

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: ${{ steps.scan.outputs.sarif-file }}

  summary-wiring:
    name: summary @v0 — the input's VALUE must reach the container
    runs-on: ubuntu-latest
    # The gap this closes: the two jobs around it exercise `base` and `fail-on` only, so
    # `summary` shipped with no consumer-truth at all — which is how a11y#329's "action.yml +
    # entrypoint declare/consume GITHUB_TOKEN" acceptance criterion was closed unmet.
    #
    # Both steps run at `fail-on: block` on purpose. The seeded img-no-alt in src/Logo.tsx is
    # WARN-tier, so at block the scan is CLEAN and exits 0 — every red below is therefore
    # attributable to INPUT_SUMMARY, never to a finding. At warn (the other job's setting) the
    # gate reds anyway and the signal would be worthless.
    permissions:
      contents: read
      pull-requests: write # the shape a real `summary: true` consumer runs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ON. `summary: "true"` renders the rollup to $GITHUB_STEP_SUMMARY — that surface needs no
      # token and no pull request, so it is the half a push/schedule-triggered smoke can reach.
      # The sticky-comment half needs a PR context this repo never has, so it logs a skip and
      # exits 0. No assertion step follows: GitHub gives each step its OWN $GITHUB_STEP_SUMMARY
      # file, so a later step cannot read this one's. The digest is visible on the run's summary
      # page; what is asserted here is that `true` is ACCEPTED and does not break a clean run.
      #
      # COUPLING, know it before you debug a red: this step has no `continue-on-error`, no `base`
      # (so it is a FULL-TREE scan), and gates at `block`. Its premise — "the only seeded finding
      # is warn-tier, so a block scan is clean" — silently ties this badge to NO block-tier finding
      # ever existing anywhere in this repo. Ship a new block-tier rule and this step reds with a
      # message pointing at `summary`, which will not be the cause. Fix by seeding-aware scoping,
      # not by relaxing the gate; `block` is what makes every OTHER red here attributable to
      # INPUT_SUMMARY. Step ORDER is also deliberate: this non-`continue-on-error` step runs FIRST
      # so a systemic failure (image pull, engine crash) reds loudly here instead of arriving as a
      # false PASS in the refusal assertion below, which reads any failure as "refused".
      - id: summary_on
        uses: Binclusive/a11y@v0
        with:
          fail-on: block
          summary: "true"

      # REFUSAL — the load-bearing assertion. The entrypoint accepts `true`, `false` and `""`;
      # anything else is REFUSED with exit 4 rather than quietly read as off. That refusal is only
      # reachable if the value actually crossed into the container, so this is the one check that
      # would have caught the dark-feature defect.
      # Be exact about what that defect WAS: `summary` was not declared as an input at all. For a
      # Docker action the runner injects `INPUT_<NAME>` for every DECLARED input (uppercased,
      # spaces → `_`, hyphens preserved), so a declared input missing from `runs.env` still
      # reaches the container — a missing `env:` line alone would not have hidden it. With no
      # declaration there is nothing to inject: the runner warns and DROPS `summary: "yes"`,
      # nothing crosses the boundary, the clean block scan exits 0, and a weaker test passes.
      - id: summary_bad
        continue-on-error: true
        uses: Binclusive/a11y@v0
        with:
          fail-on: block
          summary: "yes"

      - name: Assert the typo'd value was REFUSED
        run: |
          echo "refusal outcome: ${{ steps.summary_bad.outcome }}"
          if [ "${{ steps.summary_bad.outcome }}" != "failure" ]; then
            echo "::error::@v0 accepted summary: 'yes' — INPUT_SUMMARY is not reaching the container"
            exit 1
          fi
          echo "ok: summary: 'yes' refused — the input's value reaches the entrypoint"

  url-scan:
    name: browser action-url @v0 — must render + emit SARIF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: urlscan
        continue-on-error: true
        uses: Binclusive/a11y/action-url@v0
        with:
          url: https://example.com

      - name: Assert URL scan pulled :0-browser + emitted SARIF
        run: |
          f="${{ steps.urlscan.outputs.sarif-file }}"
          echo "url sarif-file: $f  (outcome ${{ steps.urlscan.outcome }})"
          if [ -z "$f" ] || [ ! -f "$f" ]; then
            echo "::error::action-url @v0 emitted no SARIF file (image pull or render failed?)"
            exit 1
          fi
          python3 - "$f" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert d.get("runs"), "URL SARIF has no runs[]"
          print("ok: valid URL SARIF from the :0-browser image")
          PY

      # THE consumer-shaped check (the under-testing that let the container-path bug
      # slip): a real host step must be able to resolve the emitted sarif-file path.
      # upload-artifact runs on the runner host and resolves the path against the
      # workspace — a container-internal path (e.g. /github/runner_temp/...) fails
      # here exactly as github/codeql-action/upload-sarif would for a real consumer.
      - name: Consumer proof — a host step resolves the emitted path
        uses: actions/upload-artifact@v4
        with:
          name: url-scan-sarif
          path: ${{ steps.urlscan.outputs.sarif-file }}
          if-no-files-found: error
