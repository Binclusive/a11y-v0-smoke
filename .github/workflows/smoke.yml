name: smoke
# Standing consumer-smoke for Binclusive/a11y@v0.
# Proves: @v0 resolves, its image pulls from ghcr, the engine runs, valid SARIF is
# emitted, and the static gate has TEETH (fails on a seeded violation). This is
# consumer-truth, not just ref-correctness.
#
# It runs @v0 with NO Binclusive credential. That is the point: it is the only gate
# in the org that sees what a keyless consumer sees — the monorepo's smoke.sh mounts
# a fixture OAuth session and is blind to this by construction.
#
# It is SPLIT, and the split is the point. CLI 0.21.0's identity gate means `ci` refuses
# without a credential, so one job cannot prove both things any more:
#
#   - `static-gate` / `summary-wiring` are KEYED. They prove the engine still bites and
#     that inputs reach the container — which now requires a credential to observe.
#   - `keyless-refusal` is the observation post. It asserts the REFUSAL is clean and
#     diagnostic: exit exactly 7, no SARIF, and no dangling `sarif-file` output.
#
# Do NOT "fix" a red keyless job by giving it a key. That deletes the only place anyone
# sees what a consumer without one experiences.
on:
  # STANDING triggers (#2680): the monorepo release workflows emit `image-published`
  # after each republish so any image/action change auto-runs this smoke; the daily
  # schedule is the standing safety net when no cross-repo dispatch token is set;
  # `workflow_dispatch` is the manual run and `push` keeps seed/self edits self-testing.
  repository_dispatch:
    types: [image-published]
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
  push:
permissions:
  contents: read
  security-events: write # upload-sarif to code scanning

jobs:
  static-gate:
    name: static @v0 — must FAIL on the seeded violation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # continue-on-error: a seeded violation is EXPECTED to red the gate — we
      # assert that failure below rather than letting it red the whole job.
      # fail-on: warn is the real dogfood default (the runbook gates at warn), and
      # the seeded img-no-alt is a warn-tier finding — so asserting the warn gate
      # tests the ACTUAL consumer path AND proves teeth in one shot. (At block, a
      # warn-tier finding correctly does not gate — that is not a smoke failure.)
      - id: scan
        continue-on-error: true
        uses: Binclusive/a11y@v0
        with:
          fail-on: warn
          # Since CLI 0.21.0 `ci` authenticates before it scans, so proving the gate has TEETH
          # now requires a credential. This is the KEYED half of the split — the keyless half is
          # the `keyless-refusal` job below, which asserts the opposite outcome on purpose.
          binclusive-api-key: ${{ secrets.BINCLUSIVE_API_KEY }}

      - name: Assert the gate FAILED (teeth)
        run: |
          echo "static scan outcome: ${{ steps.scan.outcome }}"
          if [ "${{ steps.scan.outcome }}" != "failure" ]; then
            echo "::error::static @v0 gate did NOT fail on a seeded img-no-alt — no teeth"
            exit 1
          fi
          echo "ok: gate failed on the seeded violation"

      - name: Assert SARIF emitted + valid + has findings
        run: |
          f="${{ steps.scan.outputs.sarif-file }}"
          echo "sarif-file: $f"
          if [ -z "$f" ] || [ ! -f "$f" ]; then
            echo "::error::static @v0 emitted no SARIF file"
            exit 1
          fi
          # A 0-byte file is NOT the same failure as a malformed one, and json.load
          # cannot tell you which. The entrypoint redirects the CLI's stdout into
          # results.sarif, so the file exists from the instant the step starts —
          # empty means the CLI refused BEFORE scanning and wrote nothing. Without
          # this branch the job reds on a JSONDecodeError traceback under a step
          # named "Assert SARIF emitted + valid", and the README's triage sends the
          # reader hunting a container-path bug (#2678) that is not there.
          if [ ! -s "$f" ]; then
            echo "::error::static @v0 wrote a 0-BYTE SARIF — it refused before scanning, not after. FIRST SUSPECT: the CLI identity gate (keyless = exit 7, 'Not authenticated'). The message is in the 'scan' step's log, which continue-on-error renders with a GREEN check — open it."
            exit 1
          fi
          python3 - "$f" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert d.get("runs"), "SARIF has no runs[]"
          n = sum(len(r.get("results", [])) for r in d["runs"])
          assert n > 0, "SARIF has zero results — the seeded violation was not reported"
          print(f"ok: valid SARIF, {n} result(s)")
          PY

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: ${{ steps.scan.outputs.sarif-file }}

  summary-wiring:
    name: summary @v0 — the input's VALUE must reach the container
    runs-on: ubuntu-latest
    # The gap this closes: the two jobs around it exercise `base` and `fail-on` only, so
    # `summary` shipped with no consumer-truth at all — which is how a11y#329's "action.yml +
    # entrypoint declare/consume GITHUB_TOKEN" acceptance criterion was closed unmet.
    #
    # Both steps run at `fail-on: block` on purpose. The seeded img-no-alt in src/Logo.tsx is
    # WARN-tier, so at block the scan is CLEAN and exits 0 — every red below is therefore
    # attributable to INPUT_SUMMARY, never to a finding. At warn (the other job's setting) the
    # gate reds anyway and the signal would be worthless.
    permissions:
      contents: read
      pull-requests: write # the shape a real `summary: true` consumer runs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ON. `summary: "true"` renders the rollup to $GITHUB_STEP_SUMMARY — that surface needs no
      # token and no pull request, so it is the half a push/schedule-triggered smoke can reach.
      # The sticky-comment half needs a PR context this repo never has, so it logs a skip and
      # exits 0. No assertion step follows: GitHub gives each step its OWN $GITHUB_STEP_SUMMARY
      # file, so a later step cannot read this one's. The digest is visible on the run's summary
      # page; what is asserted here is that `true` is ACCEPTED and does not break a clean run.
      #
      # COUPLING, know it before you debug a red: this step has no `continue-on-error`, no `base`
      # (so it is a FULL-TREE scan), and gates at `block`. Its premise — "the only seeded finding
      # is warn-tier, so a block scan is clean" — silently ties this badge to NO block-tier finding
      # ever existing anywhere in this repo. Ship a new block-tier rule and this step reds with a
      # message pointing at `summary`, which will not be the cause. Fix by seeding-aware scoping,
      # not by relaxing the gate; `block` is what makes every OTHER red here attributable to
      # INPUT_SUMMARY. Step ORDER is also deliberate: this non-`continue-on-error` step runs FIRST
      # so a systemic failure (image pull, engine crash) reds loudly here instead of arriving as a
      # false PASS in the refusal assertion below, which reads any failure as "refused".
      - id: summary_on
        uses: Binclusive/a11y@v0
        with:
          fail-on: block
          summary: "true"
          # Keyed: this step must RUN to prove `true` is accepted on a clean scan, and since
          # CLI 0.21.0 running requires a credential. The refusal step below deliberately does
          # NOT get one — see its comment.
          binclusive-api-key: ${{ secrets.BINCLUSIVE_API_KEY }}

      # REFUSAL — the load-bearing assertion. The entrypoint accepts `true`, `false` and `""`;
      # anything else is REFUSED with exit 4 rather than quietly read as off. That refusal is only
      # reachable if the value actually crossed into the container, so this is the one check that
      # would have caught the dark-feature defect.
      # Be exact about what that defect WAS: `summary` was not declared as an input at all. For a
      # Docker action the runner injects `INPUT_<NAME>` for every DECLARED input (uppercased,
      # spaces → `_`, hyphens preserved), so a declared input missing from `runs.env` still
      # reaches the container — a missing `env:` line alone would not have hidden it. With no
      # declaration there is nothing to inject: the runner warns and DROPS `summary: "yes"`,
      # nothing crosses the boundary, the clean block scan exits 0, and a weaker test passes.
      # Deliberately KEYLESS, and it stays correct that way: the entrypoint's `summary` case runs
      # BEFORE it ever invokes the CLI, so exit 4 is reached without an identity being resolved.
      # Keeping it keyless is free proof that the input marshalling is upstream of the gate.
      - id: summary_bad
        continue-on-error: true
        uses: Binclusive/a11y@v0
        with:
          fail-on: block
          summary: "yes"

      - name: Assert the typo'd value was REFUSED
        run: |
          echo "refusal outcome: ${{ steps.summary_bad.outcome }}"
          if [ "${{ steps.summary_bad.outcome }}" != "failure" ]; then
            echo "::error::@v0 accepted summary: 'yes' — INPUT_SUMMARY is not reaching the container"
            exit 1
          fi
          echo "ok: summary: 'yes' refused — the input's value reaches the entrypoint"

  # THE OBSERVATION POST. Everything above is keyed, so nothing above can see what a consumer
  # without a credential experiences — which is exactly the blind spot the monorepo's own
  # `smoke.sh` had (it mounts a fixture OAuth session, so both of its scanning lanes are keyed).
  #
  # This job does NOT assert a scan. Since CLI 0.21.0 the correct outcome for a keyless run is a
  # REFUSAL, and what is pinned here is that the refusal is CLEAN and DIAGNOSTIC — because the
  # failure mode worth catching is not "it refuses", it is "it refuses illegibly".
  #
  # It is a CONTRACT test on a product decision. If `ci` becomes keyless again this job SHOULD go
  # red, and that red is the prompt to state deliberately what a keyless consumer now sees.
  keyless-refusal:
    name: keyless @v0 — must refuse CLEANLY, naming the credential
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No `binclusive-api-key`, and no env fallback either — the whole job is the absence.
      - id: keyless
        continue-on-error: true
        uses: Binclusive/a11y@v0
        with:
          fail-on: warn

      - name: Assert it refused with exit 7, not some other non-zero
        run: |
          echo "keyless outcome: ${{ steps.keyless.outcome }}"
          if [ "${{ steps.keyless.outcome }}" != "failure" ]; then
            echo "::error::keyless @v0 did NOT fail. Either \`ci\` no longer requires a credential — in which case this job is the deliberate record of that and must be REWRITTEN, not deleted — or a key reached the container from somewhere this workflow does not declare."
            exit 1
          fi
          echo "ok: keyless run failed, as the identity gate requires"

      # Actions exposes `outcome` as success|failure|cancelled and gives no numeric exit code for
      # a `uses:` step, so the exit code itself cannot be asserted here. The 0-byte SARIF is the
      # observable proxy: a refusal happens BEFORE the scan, so nothing is ever written to it.
      # (Asserting the number properly needs an `exit-code` output on the action — Binclusive/monorepo#4934
      # tracks the related guard work.)
      - name: Assert no SARIF was produced — a refusal must not write output
        run: |
          if [ -s results.sarif ]; then
            echo "::error::keyless @v0 refused but still wrote $(wc -c < results.sarif) bytes of SARIF. If the scan now runs BEFORE the identity check, this job's premise is stale and the refusal is no longer pre-scan."
            exit 1
          fi
          echo "ok: no SARIF written"

      # THE REGRESSION THIS EXISTS FOR. The entrypoint redirects the CLI's stdout into
      # results.sarif, so the file is created the instant the step starts — which made the old
      # `-e` (exists) guard vacuous, and a refusal emitted `sarif-file` pointing at 0 bytes. The
      # consumer's upload-sarif then reported "Invalid SARIF. Unexpected end of JSON input",
      # naming the wrong step, the wrong tool and the wrong cause. Fixed in
      # Binclusive/monorepo#4931 by moving the guard to `-s` (non-empty).
      - name: Assert no dangling sarif-file output
        run: |
          f="${{ steps.keyless.outputs.sarif-file }}"
          if [ -n "$f" ]; then
            echo "::error::keyless @v0 emitted sarif-file='$f' after writing nothing — a path to a 0-byte file. This is the dangling-path regression: the customer's upload-sarif fails with 'Invalid SARIF. Unexpected end of JSON input', which names the wrong step and sends them hunting a scanner that never ran. The entrypoint guard must be -s (non-empty), never -e (exists)."
            exit 1
          fi
          echo "ok: no sarif-file emitted — upload-sarif will fail on its missing input, which points back at THIS step"

